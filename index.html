<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a5a32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>가족 성경 읽기</title>
<style>
:root{
  --bg:#F6F3EE;--surface:#FFFFFF;--surface2:#F1ECE4;--fg:#1E1A16;--muted:#8C8379;--line:rgba(30,26,22,.08);
  --accent:#8A6A3F;--on-accent:#FFFFFF;--accent-soft:#F3EBDD;--ok:#3F7D4E;--ok-soft:#E5EFE6;--bad:#C2483D;
  --shadow:0 1px 2px rgba(30,26,22,.04),0 6px 20px rgba(30,26,22,.05);
  --serif:"Gowun Batang",ui-serif,serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141210;--surface:#1E1B18;--surface2:#29251F;--fg:#EFE9E1;--muted:#9C9389;--line:rgba(255,255,255,.07);
  --accent:#D4AE7A;--on-accent:#1A1611;--accent-soft:#2F281F;--ok:#8CCB98;--ok-soft:#1E3024;--bad:#E57F74;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px 200px}
h1{font-family:var(--serif);font-size:28px;font-weight:700;margin:2px 0 4px;letter-spacing:-.02em}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:30px 4px 10px;letter-spacing:.02em}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
.muted{color:var(--muted);font-size:14px}small{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}
button{font:inherit;font-size:16px;font-weight:600;height:50px;padding:0 16px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);width:100%;margin-top:12px;cursor:pointer;transition:transform .1s,opacity .2s}
button:active{transform:scale(.98)}
button.ghost{background:var(--surface2);color:var(--fg)}
button.small{width:auto;height:34px;padding:0 12px;font-size:14px;margin:0;border-radius:10px}
button.link{background:none;color:var(--muted);width:auto;height:auto;padding:6px 8px;margin:0;font-size:13px;font-weight:500}
button:disabled{opacity:.35}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:13px 14px;border:1px solid transparent;border-radius:12px;background:var(--surface2);color:var(--fg);margin-top:6px;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{resize:vertical;line-height:1.55}
label{display:block;margin-top:16px;font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:17px;font-weight:700}
.badge{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:20px;white-space:nowrap}
.big{font-family:var(--serif);font-size:23px;font-weight:700;margin:14px 0 4px;letter-spacing:-.02em}
.turn{color:var(--accent);font-weight:600;margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;padding:3px 10px 3px 3px;border-radius:20px;background:var(--surface2);color:var(--muted);margin:3px 4px 3px 0}
.chip.on{background:var(--ok-soft);color:var(--ok)}
.chip .av{opacity:.55}.chip.on .av{opacity:1}
.bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:16px}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.rec .play{width:40px;height:40px;border-radius:50%;padding:0;margin:0;flex:none;background:var(--accent-soft);color:var(--accent);font-size:13px}
.rec>span{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rec.now .play{background:var(--accent);color:var(--on-accent)}
.rec.now>span{color:var(--accent);font-weight:600}
.note{padding:14px 0;border-top:1px solid var(--line)}.note p{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;font-family:var(--serif);font-size:16px;line-height:1.7}
.who{display:flex;align-items:center;gap:8px;font-weight:600}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;overflow:hidden;flex:none;background:var(--c,#B49B7A);color:#fff;font-size:12px;font-weight:700;vertical-align:middle}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sm{width:22px;height:22px;font-size:10px}.av.lg{width:52px;height:52px;font-size:18px}.av.xl{width:72px;height:72px;font-size:24px}
.seg{display:flex;gap:8px;margin-top:8px}.seg label{flex:1;margin:0;border:1.5px solid transparent;border-radius:14px;padding:12px;text-align:center;color:var(--fg);background:var(--surface2);font-size:15px}
.seg input{display:none}.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
nav#tabs{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav#tabs button{background:none;color:var(--muted);margin:0;border-radius:0;height:auto;padding:8px 0 8px;font-size:11px;font-weight:500}
nav#tabs button svg{display:block;margin:0 auto 2px;width:24px;height:24px}
nav#tabs button.on{color:var(--accent);font-weight:700}
#player{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:9}
#player .in{max-width:540px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
#player audio{width:100%;height:36px;margin-top:6px}
#ptitle{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-bg{position:fixed;inset:0;background:rgba(20,16,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet:before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--serif);font-size:22px;color:var(--fg);margin:0 0 4px;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.timer{font-size:52px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:22px 0;letter-spacing:-.02em}
.recbtn{width:112px;height:112px;border-radius:50%;margin:0 auto;display:block;font-size:16px;box-shadow:0 8px 24px rgba(138,106,63,.3)}
.recbtn.on{background:var(--bad);color:#fff;animation:pulse 1.4s infinite;box-shadow:0 0 0 0 rgba(194,72,61,.4)}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(194,72,61,0)}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-8px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:24px;font-size:14px;font-weight:500;opacity:0;transition:.3s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.code{font-size:34px;letter-spacing:8px;font-weight:700;text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
.pending{border-color:#D9B44A;background:color-mix(in srgb,#D9B44A 10%,var(--surface))}
.order{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.order span{flex:1}.order.off span{color:var(--muted);text-decoration:line-through}
.done{font-weight:700;color:var(--ok)}
.center{text-align:center}
.album{display:flex;gap:12px;overflow-x:auto;padding:4px 0 2px}
.album figure{margin:0;text-align:center;flex:none;position:relative}
.album figcaption{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.album .x{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;padding:0;margin:0;font-size:11px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.hero{text-align:center;padding:12vh 0 10px}.hero h1{font-size:34px}
</style>
</head>
<body>
<div id="app"><p class="muted center" style="margin-top:40vh">불러오는 중…</p></div>
<div id="player" hidden><div class="in">
  <div class="row"><button class="small ghost" data-act="prev">⏮</button><div id="ptitle"></div><button class="small ghost" data-act="next">⏭</button><button class="link" data-act="pclose">✕</button></div>
  <audio id="audio" controls preload="none"></audio>
</div></div>
<nav id="tabs" hidden>
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5C5.5 4 8.5 4 12 6c3.5-2 6.5-2 9-.5V19c-2.5-1.5-5.5-1.5-9 .5-3.5-2-6.5-2-9-.5z"/><path d="M12 6v13.5"/></svg>오늘</button>
  <button data-act="tab" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>기록</button>
  <button data-act="tab" data-tab="listen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6" rx="1.5"/><rect x="16.5" y="14" width="4.5" height="6" rx="1.5"/></svg>듣기</button>
  <button data-act="tab" data-tab="pray"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 8a4.3 4.3 0 0 1 7.5 2.8C19.5 16.4 12 21 12 21z"/></svg>기도</button>
  <button data-act="tab" data-tab="family"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg>가족</button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
// ================= 설정 =================
const SUPABASE_URL = 'https://flxwfciohthhrobmojpk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WLhXuU8x07ncuTj0eoVAYA_Su6-g-KM';
const BUCKET = 'recordings';
const TZS = [['Asia/Jakarta', '인도네시아 (자카르타)'], ['Asia/Seoul', '한국 (서울)']];
// ========================================

const BOOKS = [['창세기',50],['출애굽기',40],['레위기',27],['민수기',36],['신명기',34],['여호수아',24],['사사기',21],['룻기',4],['사무엘상',31],['사무엘하',24],['열왕기상',22],['열왕기하',25],['역대상',29],['역대하',36],['에스라',10],['느헤미야',13],['에스더',10],['욥기',42],['시편',150],['잠언',31],['전도서',12],['아가',8],['이사야',66],['예레미야',52],['예레미야애가',5],['에스겔',48],['다니엘',12],['호세아',14],['요엘',3],['아모스',9],['오바댜',1],['요나',4],['미가',7],['나훔',3],['하박국',3],['스바냐',3],['학개',2],['스가랴',14],['말라기',4],
['마태복음',28],['마가복음',16],['누가복음',24],['요한복음',21],['사도행전',28],['로마서',16],['고린도전서',16],['고린도후서',13],['갈라디아서',6],['에베소서',6],['빌립보서',4],['골로새서',4],['데살로니가전서',5],['데살로니가후서',3],['디모데전서',6],['디모데후서',4],['디도서',3],['빌레몬서',1],['히브리서',13],['야고보서',5],['베드로전서',5],['베드로후서',3],['요한일서',5],['요한이서',1],['요한삼서',1],['유다서',1],['요한계시록',22]];
const BOOKMAP = Object.fromEntries(BOOKS);

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const S = { user: null, me: null, family: null, members: [], plans: [], tab: 'today', tok: 0, lists: {}, recs: {}, urls: {}, logDays: 14, listenPlan: null, listenWho: '', form: null, avatars: [], avUrl: {} };
const AV_BUCKET = 'avatars';
const AV_COLORS = ['#B08A5B', '#7E9A7A', '#7F8FB0', '#B07F8A', '#9A8AB0', '#6F9EA3'];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nameOf = uid => S.members.find(m => m.user_id === uid)?.display_name || '(나간 가족)';
const W = ['일', '월', '화', '수', '목', '금', '토'];

function dateIn(tz, d = new Date()) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(d).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
const today = () => dateIn(S.family?.timezone || 'Asia/Jakarta');
const addDays = (ds, n) => new Date(Date.parse(ds + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5);
function fmtDate(ds) { const d = new Date(ds + 'T00:00:00Z'); return `${d.getUTCMonth() + 1}월 ${d.getUTCDate()}일 (${W[d.getUTCDay()]})`; }
const fmtTime = iso => new Date(iso).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
const fmtDur = s => s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : '';
// 프로필 사진: 올해 사진이 있으면 올해 것, 없으면 가장 최근 연도 사진
function avatarRow(uid) {
  const mine = S.avatars.filter(a => a.user_id === uid); if (!mine.length) return null;
  const y = +today().slice(0, 4);
  return mine.find(a => a.year === y) || mine.filter(a => a.year <= y).sort((a, b) => b.year - a.year)[0] || mine.sort((a, b) => b.year - a.year)[0];
}
function av(uid, cls = '', row) {
  const a = row || avatarRow(uid), url = a && S.avUrl[a.path];
  const color = AV_COLORS[[...String(uid)].reduce((s, c) => s + c.charCodeAt(0), 0) % AV_COLORS.length];
  const ch = esc((nameOf(uid) || '?').trim().charAt(0));
  return `<span class="av ${cls}" style="--c:${color}">${url ? `<img src="${esc(url)}" alt="" loading="lazy">` : ch}</span>`;
}
const who = (uid, cls = 'sm') => `${av(uid, cls)}${esc(nameOf(uid))}`;
const tzLabel = () => (TZS.find(t => t[0] === S.family?.timezone) || [, S.family?.timezone])[1];

function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function errMsg(e) { const m = e?.message || String(e); if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '인터넷 연결을 확인해 주세요'; return m; }
const view = h => { $('#app').innerHTML = h; };

// 읽기 일정 계산: 시작일로부터 N일째 → 몇 장, 누구 차례
function planDay(p, date) {
  const d = daysBetween(p.start_date, date);
  if (d < 0) return { before: true };
  const from = d * p.per_day + 1;
  if (from > p.chapters) return { after: true };
  const to = Math.min(p.chapters, from + p.per_day - 1);
  const order = p.relay_order || [];
  return { from, to, reader: p.mode === 'relay' && order.length ? order[d % order.length] : null };
}
const rangeTxt = st => st.from === st.to ? `${st.from}장` : `${st.from}–${st.to}장`;
// 전체 일정: 총 며칠, 끝나는 날
function planSpan(p) { const days = Math.ceil(p.chapters / p.per_day); return { days, end: addDays(p.start_date, days - 1) }; }
const shortDate = ds => { const d = new Date(ds + 'T00:00:00Z'); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}(${W[d.getUTCDay()]})`; };
function bookOptions(sel) {
  const opt = ([b, c]) => `<option value="${b}" ${b === sel ? 'selected' : ''}>${b} (${c}장)</option>`;
  return `<optgroup label="구약 (39권)">${BOOKS.slice(0, 39).map(opt).join('')}</optgroup><optgroup label="신약 (27권)">${BOOKS.slice(39).map(opt).join('')}</optgroup>`;
}

// ================= 휴대폰 저장 (업로드 대기열) =================
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('family-bible', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('queue', { keyPath: 'id' });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function q(mode, fn) {
  const db = await dbp;
  return new Promise((res, rej) => { const tx = db.transaction('queue', mode); const rq = fn(tx.objectStore('queue')); tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error); });
}
const qAll = () => q('readonly', s => s.getAll());

let flushing = false;
async function flushQueue() {
  if (flushing || !S.user) return;
  flushing = true; let ok = 0, fail = null;
  try {
    for (const it of await qAll()) {
      if (it.user_id !== S.user.id) continue;
      try {
        const path = `${it.family_id}/${it.user_id}/${it.id}.${it.ext}`;
        const up = await sb.storage.from(BUCKET).upload(path, it.blob, { contentType: it.mime, upsert: true });
        if (up.error) throw up.error;
        const ins = await sb.from('recordings').upsert({ id: it.id, family_id: it.family_id, plan_id: it.plan_id, user_id: it.user_id, book: it.book, chapter: it.chapter, read_date: it.read_date, path, duration_sec: it.duration_sec }, { onConflict: 'id', ignoreDuplicates: true });
        if (ins.error) throw ins.error;
        await q('readwrite', s => s.delete(it.id)); ok++;
      } catch (e) { fail = e; break; }
    }
  } finally { flushing = false; }
  if (fail) toast('업로드 실패: ' + errMsg(fail) + ' — 휴대폰에 저장돼 있어 나중에 다시 올려요', 4000);
  else if (ok) { toast(`녹음 ${ok}개 업로드 완료 ✓`); if (S.tab === 'today' || S.tab === 'log') render(); }
  updatePending();
}
async function updatePending() {

}

// ================= 재생 =================
const audio = $('#audio');
const P = { list: [], i: 0 };
async function signUrls(recs) {
  const now = Date.now();
  const need = [...new Set(recs.map(r => r.path))].filter(p => !(S.urls[p] && S.urls[p].exp > now));
  for (let i = 0; i < need.length; i += 100) {
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i, i + 100), 6 * 3600);
    if (error) { toast('재생 주소 오류: ' + errMsg(error)); return; }
    for (const d of data) if (d.signedUrl) S.urls[d.path] = { url: d.signedUrl, exp: now + 5 * 3600e3 };
  }
}
function playList(list, i) {
  P.list = list; playAt(i);
}
function playAt(i) {
  const r = P.list[i]; if (!r) return;
  const u = S.urls[r.path]; if (!u) { toast('잠시 후 다시 눌러 주세요'); return; }
  P.i = i; audio.src = u.url;
  audio.play().catch(e => toast('재생 실패: ' + errMsg(e)));
  const title = `${r.book} ${r.chapter}장 · ${nameOf(r.user_id)}`;
  $('#ptitle').textContent = (P.list.length > 1 ? `(${i + 1}/${P.list.length}) ` : '') + title;
  $('#player').hidden = false;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title, artist: S.family?.name || '가족 성경', artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] });
    navigator.mediaSession.setActionHandler('nexttrack', () => playAt(P.i + 1));
    navigator.mediaSession.setActionHandler('previoustrack', () => playAt(P.i - 1));
  }
  document.querySelectorAll('.rec.now').forEach(e => e.classList.remove('now'));
  document.querySelectorAll(`.rec[data-id="${r.id}"]`).forEach(e => e.classList.add('now'));
}
audio.addEventListener('ended', () => { if (P.i + 1 < P.list.length) playAt(P.i + 1); });

function recLine(r, key, i, opts = {}) {
  S.recs[r.id] = r;
  const label = opts.short ? who(r.user_id) : `${who(r.user_id)} <span>· ${esc(r.book)} ${r.chapter}장</span>`;
  return `<div class="rec" data-id="${r.id}"><button class="play" data-act="play" data-list="${key}" data-i="${i}" aria-label="재생">▶</button>
    <span>${label} <small>${fmtDur(r.duration_sec)}</small></span>
    ${r.user_id === S.user.id ? `<button class="link" data-act="delrec" data-id="${r.id}">삭제</button>` : ''}</div>`;
}
function noteHtml(n, showDate) {
  return `<div class="note"><div class="row"><span class="who">${who(n.user_id)}</span><small>${showDate ? fmtDate(n.read_date) + ' ' : ''}${fmtTime(n.created_at)}</small></div>

// 사진을 정사각형 320px JPEG로 줄여서 올림 (용량 약 30KB)
function shrinkImage(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const n = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas'); c.width = c.height = 320;
      c.getContext('2d').drawImage(img, (img.naturalWidth - n) / 2, (img.naturalHeight - n) / 2, n, n, 0, 0, 320, 320);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('변환 실패')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없어요')); };
    img.src = url;
  });
}
async function uploadPhoto(file, year) {
  toast('사진 올리는 중…');
  try {
    const blob = await shrinkImage(file);
    const path = `${S.family.id}/${S.user.id}/${year}-${Date.now()}.jpg`;
    const up = await sb.storage.from(AV_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
    if (up.error) throw up.error;
    const old = S.avatars.find(a => a.user_id === S.user.id && a.year === year);
    const r = await sb.from('avatars').upsert({ family_id: S.family.id, user_id: S.user.id, year, path }, { onConflict: 'family_id,user_id,year' });
    if (r.error) throw r.error;
    if (old) await sb.storage.from(AV_BUCKET).remove([old.path]);
    toast(`${year}년 사진을 저장했어요 📷`); render();
  } catch (e) { toast('사진 저장 실패: ' + errMsg(e), 4000); }
}

// 선택한 책·속도로 일정 미리보기: "로마서 16장 · 하루 1장 → 16일간"
function planPreview() {
  const book = $('#fbook').value, ch = BOOKMAP[book], per = Math.max(1, Math.min(10, +$('#fper').value || 1)), start = $('#fstart').value;
  if (!start) { $('#fpreview').innerHTML = '<span class="muted">시작일을 골라 주세요</span>'; return; }
  const sp = planSpan({ chapters: ch, per_day: per, start_date: start });
  $('#fpreview').innerHTML = `<b>${esc(book)}</b> 전체 ${ch}장 · 하루 ${per}장<br>→ <b>${sp.days}일간</b> · ${fmtDate(start)} ~ ${fmtDate(sp.end)}`;
}
// 전체 일정표: 날짜별 읽을 장과 릴레이 차례
async function openSchedule(id) {
  const p = S.plans.find(x => x.id === id); if (!p) return;
  const { data } = await sb.from('recordings').select('chapter').eq('plan_id', p.id);
  const done = new Set((data || []).map(r => r.chapter)), t = today(), sp = planSpan(p);
  let rows = '';
  for (let d = 0; d < sp.days; d++) {
    const date = addDays(p.start_date, d), st = planDay(p, date);
    const chs = Array.from({ length: st.to - st.from + 1 }, (_, i) => st.from + i), ok = chs.every(c => done.has(c));
    rows += `<div class="order" style="${date === t ? 'background:var(--accent2);border-radius:8px;padding:6px' : ''}">
      <span style="flex:none;width:72px" class="muted">${shortDate(date)}</span>
      <span>${rangeTxt(st)}${st.reader ? ` · ${esc(nameOf(st.reader))}` : ''}${date === t ? ' <b>← 오늘</b>' : ''}</span>${ok ? '<span class="chip on" style="flex:none">✓</span>' : ''}</div>`;
  }
  sheet(`<h2 style="margin-top:0">📅 ${esc(p.book)} 일정표</h2>
    <p class="muted" style="margin:0 0 8px">${p.chapters}장 · 하루 ${p.per_day}장 · 총 ${sp.days}일 (${fmtDate(p.start_date)} ~ ${fmtDate(sp.end)})</p>
    ${rows}<button class="ghost" data-act="closesheet">닫기</button>`);
}

async function savePlan() {
  const book = $('#fbook').value, mode = document.querySelector('input[name=fmode]:checked').value;
  const start_date = $('#fstart').value, per_day = Math.max(1, Math.min(10, +$('#fper').value || 1));

const MIMES = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
const R = { rec: null, stream: null, chunks: [], start: 0, timer: null, lock: null, plan: null };
function sheet(h) { $('#sheet').innerHTML = `<div class="sheet-bg"><div class="sheet">${h}</div></div>`; }
function closeSheet() { $('#sheet').innerHTML = ''; }

function openRecorder(planId, ch) {
  const p = S.plans.find(x => x.id === planId); R.plan = p;
  sheet(`<h2 style="margin-top:0">🎙 ${esc(p.book)} 녹음</h2>
    <label>몇 장을 읽나요?<select id="rch">${Array.from({ length: p.chapters }, (_, i) => `<option value="${i + 1}" ${i + 1 === ch ? 'selected' : ''}>${i + 1}장</option>`).join('')}</select></label>
    <div class="timer" id="rtime">0:00</div>
    <button class="recbtn" id="rbtn" data-act="rectoggle">● 시작</button>
    <p class="muted center">녹음하는 동안 화면을 끄거나 다른 앱으로 가지 마세요.<br>정지하면 휴대폰에 먼저 저장되고 자동으로 올라가요.</p>
    <button class="ghost" id="rclose" data-act="closesheet">닫기</button>`);
}
async function recToggle() {
  if (R.rec && R.rec.state === 'recording') return recStop();
  try {
    R.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  } catch (e) { toast('마이크를 쓸 수 없어요. 설정에서 마이크 권한을 허용해 주세요', 4500); return; }
  const mime = MIMES.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  const opt = { audioBitsPerSecond: 48000 }; if (mime) opt.mimeType = mime;
  R.rec = new MediaRecorder(R.stream, opt); R.chunks = [];
  R.rec.ondataavailable = e => { if (e.data.size) R.chunks.push(e.data); };
  R.rec.onstop = recSave;
  R.rec.start(1000); R.start = Date.now();
  try { R.lock = await navigator.wakeLock?.request('screen'); } catch (e) {}
  $('#rbtn').classList.add('on'); $('#rbtn').textContent = '■ 정지'; $('#rclose').disabled = true; $('#rch').disabled = true;
  R.timer = setInterval(() => { $('#rtime').textContent = fmtDur(Math.round((Date.now() - R.start) / 1000)) || '0:00'; }, 500);
}
function recStop() {
  clearInterval(R.timer); R.rec.stop(); R.stream.getTracks().forEach(t => t.stop());
  try { R.lock?.release(); } catch (e) {}
}
async function recSave() {
  const secs = Math.round((Date.now() - R.start) / 1000);
  const chapter = +$('#rch').value; closeSheet();
  if (secs < 2) return toast('너무 짧아서 저장하지 않았어요');
  const type = R.rec.mimeType || 'audio/mp4', mime = type.split(';')[0];
  const item = { id: crypto.randomUUID(), user_id: S.user.id, family_id: S.family.id, plan_id: R.plan.id, book: R.plan.book, chapter,
    read_date: today(), duration_sec: secs, mime, ext: mime.includes('webm') ? 'webm' : 'm4a', blob: new Blob(R.chunks, { type: mime }) };
  try { await q('readwrite', s => s.put(item)); }
  catch (e) { toast('휴대폰 저장 실패: ' + errMsg(e)); return; }
  toast('휴대폰에 저장했어요. 올리는 중…');
  updatePending(); flushQueue();
}

  },
};
const CHANGE_ACTS = new Set(['authmode', 'lplan', 'lwho', 'tz', 'otoggle', 'photo']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || CHANGE_ACTS.has(el.dataset.act) || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el.dataset, el); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el || !CHANGE_ACTS.has(el.dataset.act)) return;
  ACT[el.dataset.act](el.dataset, el);
});

boot().catch(e => view(`<div class="card"><p>시작 실패: ${esc(errMsg(e))}</p><button data-act="reload">다시 시도</button></div>`));
</script>
</body>
</html>
